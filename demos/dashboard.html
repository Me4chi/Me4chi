<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="FLUX Analytics — SaaS dashboard demo: KPIs, interactive charts, sortable and searchable table.">
  <title>FLUX Analytics — Demo by Me4chi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root { --bg: #0d1117; --panel: #151b24; --panel-2: #1b2330; --line: #263142; --text: #e6edf6; --muted: #8b98ab; --accent: #5b8cff; --good: #2fd08c; --bad: #ff6b6b; --warn: #f5b84a; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, sans-serif; }
    button, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
    .side { position: sticky; top: 0; height: 100vh; padding: 22px 16px; border-right: 1px solid var(--line); background: var(--panel); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; font: 700 20px 'Space Grotesk', sans-serif; }
    .brand i { width: 28px; height: 28px; border-radius: 8px; background: conic-gradient(from 200deg, var(--accent), #a35bff, var(--good), var(--accent)); }
    .side nav { display: grid; gap: 4px; }
    .side a { display: flex; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; }
    .side a[aria-current='page'], .side a:hover { background: var(--panel-2); color: var(--text); }
    .plan { position: absolute; left: 16px; right: 16px; bottom: 22px; padding: 14px; border-radius: 12px; background: linear-gradient(135deg, #2a3b78, #4b2a78); font-size: 13px; }
    .plan b { display: block; margin-bottom: 4px; }
    main { padding: 24px 28px 80px; min-width: 0; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    h1 { margin: 0; font: 700 26px 'Space Grotesk', sans-serif; }
    .muted { color: var(--muted); }
    .range { display: flex; padding: 4px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
    .range button { padding: 7px 14px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; font-weight: 600; }
    .range button[aria-pressed='true'] { background: var(--panel-2); color: var(--text); }

    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
    .card { padding: 18px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
    .kpi .label { color: var(--muted); font-size: 13px; }
    .kpi .value { margin: 6px 0 2px; font: 700 28px 'Space Grotesk', sans-serif; }
    .delta { font-size: 12px; font-weight: 600; }
    .up { color: var(--good); } .down { color: var(--bad); }
    .spark { display: block; width: 100%; height: 36px; margin-top: 10px; }

    .row { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 14px; }
    .card h2 { margin: 0 0 4px; font: 700 16px 'Space Grotesk', sans-serif; }
    .chart { position: relative; height: 260px; margin-top: 12px; }
    .chart svg { width: 100%; height: 100%; overflow: visible; }
    .tip { position: absolute; pointer-events: none; padding: 8px 10px; border-radius: 8px; background: #0b0f15; border: 1px solid var(--line); font-size: 12px; white-space: nowrap; transform: translate(-50%, -120%); opacity: 0; transition: opacity .15s; }
    .bars { display: grid; gap: 14px; margin-top: 16px; }
    .bar-row { display: grid; gap: 6px; }
    .bar-row div:first-child { display: flex; justify-content: space-between; }
    .track { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
    .track i { display: block; height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }

    .table-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .table-head input { width: 240px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 620px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
    th button { padding: 0; border: 0; background: none; cursor: pointer; text-transform: inherit; letter-spacing: inherit; color: inherit; }
    th button::after { content: ' ↕'; opacity: .4; }
    th[aria-sort='ascending'] button::after { content: ' ↑'; opacity: 1; }
    th[aria-sort='descending'] button::after { content: ' ↓'; opacity: 1; }
    td.num, th.num { text-align: right; }
    .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .pill.paid { background: #2fd08c22; color: var(--good); } .pill.pending { background: #f5b84a22; color: var(--warn); } .pill.refunded { background: #ff6b6b22; color: var(--bad); }
    .who { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #0d1117; }
    .back { position: fixed; z-index: 20; right: 18px; bottom: 18px; padding: 10px 16px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 13px; text-decoration: none; }
    @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } .row { grid-template-columns: 1fr; } }
    @media (max-width: 760px) { .app { grid-template-columns: 1fr; } .side { display: none; } main { padding: 18px; } .kpis { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Main navigation">
      <div class="brand"><i aria-hidden="true"></i>FLUX</div>
      <nav>
        <a href="#" aria-current="page">◧ Overview</a><a href="#">⇅ Revenue</a><a href="#">◎ Customers</a><a href="#">▤ Reports</a><a href="#">⚙ Settings</a>
      </nav>
      <div class="plan"><b>Pro trial · 9 days left</b>Unlock forecasts and team seats.</div>
    </aside>

    <main>
      <div class="top">
        <div><h1>Overview</h1><span class="muted">Welcome back — here is how your store is doing.</span></div>
        <div class="range" role="group" aria-label="Date range" id="range">
          <button type="button" data-days="7">7 days</button><button type="button" data-days="30" aria-pressed="true">30 days</button><button type="button" data-days="90">90 days</button>
        </div>
      </div>

      <section class="kpis" id="kpis" aria-label="Key metrics"></section>

      <div class="row">
        <section class="card" aria-labelledby="rev-title">
          <h2 id="rev-title">Revenue</h2><span class="muted" id="rev-sub"></span>
          <div class="chart" id="chart"><svg id="svg" role="img" aria-label="Revenue chart"></svg><div class="tip" id="tip"></div></div>
        </section>
        <section class="card" aria-labelledby="ch-title">
          <h2 id="ch-title">Traffic channels</h2><span class="muted">Share of sessions</span>
          <div class="bars" id="bars"></div>
        </section>
      </div>

      <section class="card" aria-labelledby="orders-title">
        <div class="table-head"><h2 id="orders-title">Recent orders</h2><input id="q" type="search" placeholder="Search customer or ID" aria-label="Search orders"></div>
        <div class="scroll"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
      </section>
    </main>
  </div>
  <a class="back" href="../index.html#sites">← Portfolio</a>

  <script>
    const $ = s => document.querySelector(s);
    // Seeded random so the demo shows the same data on every visit.
    let seed = 7;
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const series = Array.from({ length: 90 }, (_, i) => Math.round(3200 + i * 18 + Math.sin(i / 4) * 420 + rand() * 600));
    const fmt = n => n >= 1000 ? `$${(n / 1000).toFixed(1)}k` : `$${n}`;
    let days = 30;

    function spark(data, color) {
      const max = Math.max(...data), min = Math.min(...data);
      const pts = data.map((v, i) => `${(i / (data.length - 1)) * 100},${36 - ((v - min) / (max - min || 1)) * 32 - 2}`).join(' ');
      return `<svg class="spark" viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
    }
    function renderKpis() {
      const cur = series.slice(-days), prev = series.slice(-days * 2, -days);
      const sum = a => a.reduce((s, v) => s + v, 0);
      const revenue = sum(cur), before = sum(prev) || revenue * 0.9;
      const items = [
        ['Revenue', fmt(revenue), (revenue / before - 1) * 100, cur, '#5b8cff'],
        ['Orders', Math.round(revenue / 48).toLocaleString('en'), (revenue / before - 1) * 80, cur.map(v => v / 48), '#a35bff'],
        ['Conversion', `${(3.1 + days / 200).toFixed(2)}%`, 4.2, cur.map((v, i) => Math.sin(i / 3) + v / 3000), '#2fd08c'],
        ['Refund rate', `${(1.9 - days / 300).toFixed(2)}%`, -6.5, cur.map((v, i) => Math.cos(i / 5)), '#ff6b6b'],
      ];
      $('#kpis').innerHTML = items.map(([l, v, d, data, c]) => `<div class="card kpi"><div class="label">${l}</div><div class="value">${v}</div><span class="delta ${d >= 0 === (l !== 'Refund rate') ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(1)}% vs previous</span>${spark(data, c)}</div>`).join('');
    }
    function renderChart() {
      const data = series.slice(-days);
      const box = $('#chart').getBoundingClientRect();
      const W = box.width, H = box.height, pad = 28;
      const max = Math.max(...data) * 1.08, min = Math.min(...data) * 0.9;
      const x = i => pad + (i / (data.length - 1)) * (W - pad * 1.5);
      const y = v => H - pad - ((v - min) / (max - min)) * (H - pad * 2);
      const line = data.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
      const grid = [0, 1, 2, 3].map(k => { const v = min + ((max - min) * k) / 3; return `<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#263142"/><text x="0" y="${y(v) + 4}" fill="#8b98ab" font-size="11">${fmt(Math.round(v))}</text>`; }).join('');
      $('#svg').setAttribute('viewBox', `0 0 ${W} ${H}`);
      $('#svg').innerHTML = `<defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5b8cff" stop-opacity=".35"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></linearGradient></defs>${grid}
        <path d="${line}L${x(data.length - 1)},${H - pad}L${x(0)},${H - pad}Z" fill="url(#fill)"/>
        <path d="${line}" fill="none" stroke="#5b8cff" stroke-width="2.5" stroke-linejoin="round"/>
        <circle id="dot" r="5" fill="#0d1117" stroke="#5b8cff" stroke-width="2.5" opacity="0"/>
        <rect id="hit" x="${pad}" y="0" width="${W - pad}" height="${H}" fill="transparent"/>`;
      const total = data.reduce((s, v) => s + v, 0);
      $('#rev-sub').textContent = `${fmt(total)} in the last ${days} days`;
      const tip = $('#tip'), dot = $('#dot');
      $('#hit').addEventListener('pointermove', e => {
        const r = $('#svg').getBoundingClientRect();
        const i = Math.max(0, Math.min(data.length - 1, Math.round(((e.clientX - r.left - pad) / (W - pad * 1.5)) * (data.length - 1))));
        dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(data[i])); dot.setAttribute('opacity', 1);
        const date = new Date(Date.now() - (data.length - 1 - i) * 864e5);
        tip.innerHTML = `<b>${fmt(data[i])}</b> · ${date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`;
        tip.style.left = `${x(i)}px`; tip.style.top = `${y(data[i])}px`; tip.style.opacity = 1;
      });
      $('#hit').addEventListener('pointerleave', () => { tip.style.opacity = 0; dot.setAttribute('opacity', 0); });
    }
    function renderBars() {
      const channels = [['Organic search', 38 + days / 30, '#5b8cff'], ['Social', 24 + days / 45, '#a35bff'], ['Direct', 18, '#2fd08c'], ['Email', 12 - days / 60, '#f5b84a'], ['Referral', 8, '#ff6b6b']];
      $('#bars').innerHTML = channels.map(([n, v, c]) => `<div class="bar-row"><div><span>${n}</span><b>${v.toFixed(1)}%</b></div><div class="track"><i style="width:0;background:${c}" data-w="${v * 2}%"></i></div></div>`).join('');
      requestAnimationFrame(() => document.querySelectorAll('.track i').forEach(i => (i.style.width = i.dataset.w)));
    }

    const names = ['Ava Chen', 'Noah Kim', 'Mila Rossi', 'Leo Novak', 'Iris Park', 'Omar Haddad', 'Zoe Martin', 'Kai Sato', 'Nina Petrova', 'Luca Bianchi', 'Emma Silva', 'Arjun Rao'];
    const statuses = ['paid', 'paid', 'paid', 'pending', 'refunded'];
    const orders = names.map((n, i) => ({ id: `#${48210 + i * 7}`, name: n, date: new Date(Date.now() - i * 5.3e7), status: statuses[Math.floor(rand() * statuses.length)], total: Math.round(40 + rand() * 460) }));
    const cols = [['id', 'Order'], ['name', 'Customer'], ['date', 'Date'], ['status', 'Status'], ['total', 'Total']];
    const sort = { key: 'date', dir: -1 };
    function renderTable() {
      $('#thead').innerHTML = cols.map(([k, l]) => `<th class="${k === 'total' ? 'num' : ''}" aria-sort="${sort.key === k ? (sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" data-sort="${k}">${l}</button></th>`).join('');
      const q = $('#q').value.trim().toLowerCase();
      const rows = orders.filter(o => (o.name + o.id).toLowerCase().includes(q)).sort((a, b) => (a[sort.key] > b[sort.key] ? 1 : -1) * sort.dir);
      const hue = s => [...s].reduce((h, c) => h + c.charCodeAt(0), 0) % 360;
      $('#tbody').innerHTML = rows.map(o => `<tr><td>${o.id}</td><td><span class="who"><span class="avatar" style="background:hsl(${hue(o.name)} 70% 70%)">${o.name.split(' ').map(w => w[0]).join('')}</span>${o.name}</span></td><td>${o.date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</td><td><span class="pill ${o.status}">${o.status}</span></td><td class="num">$${o.total}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No orders match.</td></tr>';
    }
    document.addEventListener('click', e => {
      const s = e.target.closest('[data-sort]');
      if (s) { sort.dir = sort.key === s.dataset.sort ? -sort.dir : 1; sort.key = s.dataset.sort; renderTable(); }
      const r = e.target.closest('[data-days]');
      if (r) {
        days = Number(r.dataset.days);
        document.querySelectorAll('[data-days]').forEach(b => b.setAttribute('aria-pressed', b === r));
        renderKpis(); renderChart(); renderBars();
      }
    });
    $('#q').addEventListener('input', renderTable);
    addEventListener('resize', renderChart);
    renderKpis(); renderChart(); renderBars(); renderTable();
  </script>
</body>
</html>
